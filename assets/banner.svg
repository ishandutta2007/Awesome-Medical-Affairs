<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 380"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f24"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulse{0%{transform:scale(1);opacity:.5}50%{transform:scale(1.3);opacity:1}}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}.pulse-node,.pulse-node-delayed{animation:pulse 3s infinite ease-in-out}.pulse-node-delayed{animation-delay:1.5s}.wave-line{stroke-dasharray:8 8;animation:dash 30s linear infinite}.glow-title{font-weight:800;fill:url(#textGrad);filter:drop-shadow(0 4px 12px rgba(56,189,248,.4))}.glow-title,.pill-text,.subtitle{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-weight:400;fill:#e2e8f0;letter-spacing:.5px}.pill-text{font-weight:600;font-size:13px;fill:#38bdf8}</style><rect width="1200" height="380" fill="url(#bgGrad)" rx="16"/><g opacity=".25"><path fill="none" stroke="#06b6d4" stroke-width="2" d="M 0 100 Q 300 180 600 100 T 1200 100" class="wave-line"/><path fill="none" stroke="#8b5cf6" stroke-width="2" d="M 0 280 Q 300 200 600 280 T 1200 280" class="wave-line"/><line x1="150" x2="280" y1="80" y2="160" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="1.5"/><line x1="280" x2="400" y1="160" y2="90" stroke="#38bdf8" stroke-width="1.5"/><line x1="1000" x2="1120" y1="90" y2="170" stroke="#818cf8" stroke-dasharray="4 4" stroke-width="1.5"/><line x1="880" x2="1000" y1="180" y2="90" stroke="#818cf8" stroke-width="1.5"/><circle cx="150" cy="80" r="6" fill="#06b6d4" class="pulse-node"/><circle cx="280" cy="160" r="8" fill="#3b82f6" class="pulse-node-delayed"/><circle cx="400" cy="90" r="5" fill="#38bdf8" class="pulse-node"/><circle cx="1000" cy="90" r="7" fill="#818cf8" class="pulse-node"/><circle cx="1120" cy="170" r="6" fill="#c084fc" class="pulse-node-delayed"/><circle cx="880" cy="180" r="5" fill="#a855f7" class="pulse-node"/></g><rect width="1060" height="290" x="70" y="45" fill="#0f172a" fill-opacity=".75" stroke="url(#accentGrad)" stroke-width="1.5" filter="url(#softGlow)" rx="16"/><g transform="translate(100, 75)"><rect width="250" height="28" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="14"/><circle cx="16" cy="14" r="5" fill="#10b981"/><text x="30" y="19" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">AWESOME PHARMA TECH ecosystem</text></g><text x="100" y="155" class="glow-title" font-size="46">Awesome Medical Affairs</text><text x="100" y="198" class="subtitle" font-size="18"><tspan x="100" dy="0">Curated SaaS Platforms, Open-Source Repositories &amp; AI Tools for Medical Science Liaisons (MSL),</tspan> <tspan x="100" dy="26">Scientific Exchange, Medical Information, KOL Engagement &amp; Compliance Orchestration</tspan></text><g><g transform="translate(100, 270) translate(0, 0)"><rect width="130" height="32" fill="#1e293b" stroke="#0284c7" stroke-width="1" rx="8"/><text x="65" y="20" class="pill-text" text-anchor="middle">💼 SaaS CRM</text></g><g transform="translate(100, 270) translate(142, 0)"><rect width="165" height="32" fill="#1e293b" stroke="#0284c7" stroke-width="1" rx="8"/><text x="82.5" y="20" class="pill-text" text-anchor="middle">🎯 KOL Engagement</text></g><g transform="translate(100, 270) translate(319, 0)"><rect width="165" height="32" fill="#1e293b" stroke="#0284c7" stroke-width="1" rx="8"/><text x="82.5" y="20" class="pill-text" text-anchor="middle">🤖 AI &amp; LLM Agents</text></g><g transform="translate(100, 270) translate(496, 0)"><rect width="175" height="32" fill="#1e293b" stroke="#0284c7" stroke-width="1" rx="8"/><text x="87.5" y="20" class="pill-text" text-anchor="middle">🔬 Medical Information</text></g><g transform="translate(100, 270) translate(683, 0)"><rect width="150" height="32" fill="#1e293b" stroke="#0284c7" stroke-width="1" rx="8"/><text x="75" y="20" class="pill-text" text-anchor="middle">🛡️ GxP Compliance</text></g></g></svg>